name: 🐛 Bug report
description: Reporta un problema del launcher.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Gracias por reportar. Completa los datos para poder reproducirlo."
  - type: input
    id: version
    attributes:
      label: Versión del launcher
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Versión de Windows
      placeholder: "Windows 11 23H2"
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      placeholder: "1. Abro el launcher\n2. Pulso Jugar\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
  - type: textarea
    id: actual
    attributes:
      label: Comportamiento actual / error
  - type: textarea
    id: logs
    attributes:
      label: Logs / capturas
      description: "Pega aquí el contenido de %APPDATA%/Proyectados MC/profile.json (sin datos sensibles) o capturas."
