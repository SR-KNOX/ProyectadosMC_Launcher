<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="184" viewBox="0 0 1000 184" role="img" aria-labelledby="ft fd">
  <title id="ft">Cómo funciona PMC Launcher</title>
  <desc id="fd">Cuatro pasos: descargas el instalador, eliges carpeta y nick, se instalan Forge y los mods, y pulsas Jugar.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d111a"/>
      <stop offset=".6" stop-color="#0a0d14"/>
      <stop offset="1" stop-color="#10141f"/>
    </linearGradient>
    <linearGradient id="last" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e03434"/>
      <stop offset="1" stop-color="#8f1010"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#d92c2c" stop-opacity=".4"/>
      <stop offset="1" stop-color="#d92c2c" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="panel">
      <rect width="1000" height="184" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#panel)">
    <rect width="1000" height="184" fill="url(#bg)"/>
    <ellipse cx="866" cy="92" rx="190" ry="86" fill="url(#glow)">
      <animate attributeName="opacity" values=".55;1;.55" dur="6s" repeatCount="indefinite"/>
    </ellipse>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      <g>
        <rect x="24" y="50" width="220" height="84" rx="14" fill="#151a26" stroke="#262d3c" stroke-width="1.5"/>
        <text x="42" y="76" font-size="10.5" font-weight="700" letter-spacing="2.2" fill="#e5484d">01</text>
        <text x="42" y="108" font-size="15.5" font-weight="600" fill="#e6edf3">Descargas el .exe</text>
      </g>

      <g>
        <rect x="268" y="50" width="220" height="84" rx="14" fill="#151a26" stroke="#262d3c" stroke-width="1.5"/>
        <text x="286" y="76" font-size="10.5" font-weight="700" letter-spacing="2.2" fill="#e5484d">02</text>
        <text x="286" y="108" font-size="15.5" font-weight="600" fill="#e6edf3">Eliges carpeta y nick</text>
      </g>

      <g>
        <rect x="512" y="50" width="220" height="84" rx="14" fill="#151a26" stroke="#262d3c" stroke-width="1.5"/>
        <text x="530" y="76" font-size="10.5" font-weight="700" letter-spacing="2.2" fill="#e5484d">03</text>
        <text x="530" y="108" font-size="15" font-weight="600" fill="#e6edf3">Instala Forge y los mods</text>
      </g>

      <g>
        <rect x="756" y="50" width="220" height="84" rx="14" fill="url(#last)"/>
        <text x="774" y="76" font-size="10.5" font-weight="700" letter-spacing="2.2" fill="#ffffff" fill-opacity=".75">04</text>
        <text x="774" y="108" font-size="15.5" font-weight="700" fill="#ffffff">Pulsas Jugar</text>
      </g>

      <g fill="none" stroke="#4a5262" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M250 86 L256 92 L250 98"/>
        <path d="M494 86 L500 92 L494 98"/>
        <path d="M738 86 L744 92 L738 98"/>
      </g>
    </g>
  </g>

  <rect x="0.75" y="0.75" width="998.5" height="182.5" rx="17.25" fill="none" stroke="#242b38" stroke-width="1.5"/>
</svg>
