<svg xmlns="http://www.w3.org/2000/svg" width="480" height="220" viewBox="0 0 480 220" role="img" aria-labelledby="ct cd">
  <title id="ct">Contacto directo con knox.sr</title>
  <desc id="cd">Escribe a knox.sr en Discord para dudas, bugs o colaboracion.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241016"/>
      <stop offset=".55" stop-color="#130a0d"/>
      <stop offset="1" stop-color="#1d0d13"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8f8f"/>
      <stop offset=".5" stop-color="#d92c2c"/>
      <stop offset="1" stop-color="#961414"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d92c2c"/>
      <stop offset="1" stop-color="#8f1010"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".3"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#d92c2c" stop-opacity=".5"/>
      <stop offset="1" stop-color="#d92c2c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="corner">
      <stop offset="0" stop-color="#ff4d4d" stop-opacity=".2"/>
      <stop offset="1" stop-color="#ff4d4d" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <clipPath id="card">
      <rect width="480" height="220" rx="22"/>
    </clipPath>
    <clipPath id="pillClip">
      <rect x="28" y="156" width="424" height="36" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="480" height="220" fill="url(#bg)"/>
    <circle cx="52" cy="52" r="96" fill="url(#glow)" filter="url(#soft)">
      <animate attributeName="opacity" values=".5;1;.5" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="452" cy="212" r="120" fill="url(#corner)"/>

    <rect x="28" y="28" width="56" height="56" rx="16" fill="url(#tile)"/>
    <g transform="translate(40.4,40.4) scale(1.3)" fill="#ffffff">
      <path d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189Z"/>
    </g>

    <circle cx="440" cy="42" r="4" fill="#3fb950">
      <animate attributeName="opacity" values="1;.3;1" dur="3.1s" repeatCount="indefinite"/>
    </circle>

    <circle cx="404" cy="88" r="46" fill="none" stroke="#d92c2c" stroke-opacity=".22" stroke-width="1.5" stroke-dasharray="3 9">
      <animateTransform attributeName="transform" type="rotate" from="0 404 88" to="360 404 88" dur="70s" repeatCount="indefinite"/>
    </circle>
    <circle cx="404" cy="88" r="28" fill="none" stroke="#d92c2c" stroke-opacity=".14" stroke-width="1"/>

    <g font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
      <text x="100" y="47" font-size="11" font-weight="700" letter-spacing="2.6" fill="#ff9b9b">CONTACTO DIRECTO</text>
      <text x="100" y="76" font-size="22" font-weight="700" fill="#ffffff">knox.sr</text>

      <text x="28" y="112" font-size="13.5" fill="#c9aeb2">Bugs, dudas, ideas o</text>
      <text x="28" y="132" font-size="13.5" fill="#c9aeb2">colaboración con el proyecto.</text>

      <rect x="28" y="156" width="424" height="36" rx="18" fill="url(#pill)"/>
      <rect x="-80" y="156" width="80" height="36" fill="url(#sheen)" clip-path="url(#pillClip)">
        <animate attributeName="x" values="-80;460;460" keyTimes="0;.4;1" dur="7s" begin="1.5s" repeatCount="indefinite"/>
      </rect>
      <text x="240" y="179" font-size="13" font-weight="700" letter-spacing=".8" fill="#ffffff" text-anchor="middle">ESCRIBIR A KNOX.SR</text>
    </g>
  </g>

  <rect x="0.75" y="0.75" width="478.5" height="218.5" rx="21.25" fill="none" stroke="#d92c2c" stroke-opacity=".5" stroke-width="1.5"/>
</svg>
