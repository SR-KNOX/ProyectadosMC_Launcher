<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="132" viewBox="0 0 1000 132" role="img" aria-labelledby="st sd">
  <title id="st">PMC Launcher en cifras</title>
  <desc id="sd">Mas de 200 mods, Minecraft 1.18.2, Forge 40.3.12, un instalador y cero cuentas de Mojang.</desc>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <g fill="#e5484d" font-size="34" font-weight="700">
      <text x="100" y="62">200+</text>
      <text x="300" y="62">1.18.2</text>
      <text x="500" y="62">40.3.12</text>
      <text x="700" y="62">1</text>
      <text x="900" y="62">0</text>
    </g>
    <g fill="#8b949e" font-size="11" font-weight="600" letter-spacing="1.6">
      <text x="100" y="90">MODS</text>
      <text x="300" y="90">MINECRAFT</text>
      <text x="500" y="90">FORGE</text>
      <text x="700" y="90">INSTALADOR</text>
      <text x="900" y="90">CUENTAS DE MOJANG</text>
    </g>
    <g stroke="#8b949e" stroke-opacity=".22" stroke-width="1">
      <line x1="200" y1="30" x2="200" y2="98"/>
      <line x1="400" y1="30" x2="400" y2="98"/>
      <line x1="600" y1="30" x2="600" y2="98"/>
      <line x1="800" y1="30" x2="800" y2="98"/>
    </g>
  </g>
</svg>
